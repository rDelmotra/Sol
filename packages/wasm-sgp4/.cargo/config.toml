# Homebrew Rust does not ship rust-lld, so the wasm target needs an external
# linker (`brew install lld` provides wasm-ld). Rustup toolchains bundle
# rust-lld and don't need this file — if the override breaks your setup,
# install lld or delete this file locally.
[target.wasm32-unknown-unknown]
linker = "wasm-ld"
