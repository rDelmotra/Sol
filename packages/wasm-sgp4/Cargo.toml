[package]
name = "wasm-sgp4"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
sgp4 = { version = "2.4.0", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["alloc", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
serde_json = "1.0"

